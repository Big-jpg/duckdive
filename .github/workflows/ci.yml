name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reviewer-baseline:
    name: Credential-free reviewer baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.0

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run lint
        run: pnpm lint

      - name: Run type checking
        run: pnpm typecheck

      - name: Build application
        run: pnpm build

      - name: Replay sanitized fixture
        run: pnpm review:replay

      - name: Verify Price Frontier reconstruction
        run: pnpm review:verify

      - name: Verify bounded-agent architecture
        run: pnpm review:architecture

      - name: Verify case study
        run: pnpm review:case-study

      - name: Verify asset manifest
        run: pnpm review:assets

      - name: Verify documentation links
        run: pnpm review:links

      - name: Scan tracked files
        run: pnpm review:security

      - name: Verify public-review readiness
        run: pnpm review:readiness

      - name: Confirm validation leaves no tracked changes
        run: git diff --exit-code

      - name: Confirm validation leaves a clean worktree
        run: test -z "$(git status --porcelain --untracked-files=all)"
